{% extends "base.html" %}

{% block content %}

<h2>Add New Student</h2>

<form method="POST" class="student-form">

    <label for="name">Full Name</label>
    <input type="text" id="name"
           name="name"
           value="{{ request.form.get('name', '') }}"
           required>

    <label for="group">Group</label>
    <input type="text" id="group"
           name="group"
           value="{{ request.form.get('group', '') }}"
           placeholder="e.g. SE-2301"
           required>

    <label for="email">Email</label>
    <input type="email" id="email"
           name="email"
           value="{{ request.form.get('email', '') }}"
           required>

    <label for="phone">Phone Number</label>
    <input type="tel" id="phone"
           name="phone"
           value="{{ request.form.get('phone', '') }}"
           placeholder="+7 701 234 5678"
           required>
    <small class="hint">10–15 digits; spaces, dashes and a leading + are allowed.</small>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">
            Save Student
        </button>

        <a href="{{ url_for('student.students') }}"
           class="btn btn-secondary">
            Cancel
        </a>
    </div>

</form>

{% endblock %}
