{% extends "base.html" %}
{% block content %}
<section class="panel">
    <h1>{{ 'Edit Product' if product else 'Add Product' }}</h1>
    <form method="POST">
        <label>Product Name</label>
        <input name="name" value="{{ product.name if product else '' }}" required>

        <label>Category</label>
        <input name="category" list="categories"
               value="{{ product.category if product else '' }}" required>
        <datalist id="categories">
            <option value="Computers">
            <option value="Accessories">
            <option value="Audio">
        </datalist>

        <label>Price ($)</label>
        <input type="number" name="price" min="0" step="0.01"
               value="{{ product.price if product else '' }}" required>

        <button>Save Product</button>
        <a class="back" href="{{ url_for('products') }}">← Back to products</a>
    </form>
</section>
{% endblock %}
