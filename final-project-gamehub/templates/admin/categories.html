{% extends "base.html" %}
{% block title %}Categories{% endblock %}
{% block content %}
<h1>Categories</h1>
<form method="POST" class="row add-row">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <input name="name" placeholder="New category name" maxlength="50" required>
    <button class="btn">+ Add</button>
</form>
<div class="table-wrap">
<table>
    <thead><tr><th>ID</th><th>Name</th><th>Products</th><th></th></tr></thead>
    <tbody>
    {% for c in categories %}
    <tr>
        <td>{{ c.id }}</td>
        <td>
            <form method="POST" action="{{ url_for('admin.edit_category', category_id=c.id) }}" class="row">
                <input type="hidden" name="_csrf" value="{{ csrf_token }}">
                <input name="name" value="{{ c.name }}" maxlength="50" required>
                <button class="btn ghost small">Rename</button>
            </form>
        </td>
        <td>{{ c.product_count }}</td>
        <td>
            <form method="POST" action="{{ url_for('admin.delete_category', category_id=c.id) }}" onsubmit="return confirm('Delete category?');">
                <input type="hidden" name="_csrf" value="{{ csrf_token }}">
                <button class="btn danger small">Delete</button>
            </form>
        </td>
    </tr>
    {% endfor %}
    </tbody>
</table>
</div>
{% endblock %}
