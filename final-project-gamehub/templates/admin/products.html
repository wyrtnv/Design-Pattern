{% extends "base.html" %}
{% block title %}Products{% endblock %}
{% block content %}
<div class="page-head">
    <h1>Products</h1>
    <a href="{{ url_for('admin.add_product') }}" class="btn">+ Add product</a>
</div>
<div class="table-wrap">
<table>
    <thead><tr><th>ID</th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr></thead>
    <tbody>
    {% for p in products %}
    <tr>
        <td>{{ p.id }}</td>
        <td><span class="icon">{{ p.icon }}</span> {{ p.name }}</td>
        <td><span class="tag">{{ p.category_name }}</span></td>
        <td>{{ p.price|money }}</td>
        <td><span class="stock {{ 'low' if p.stock <= 3 }} {{ 'out' if not p.in_stock }}">{{ p.stock }}</span></td>
        <td><div class="actions">
            <a href="{{ url_for('admin.edit_product', product_id=p.id) }}" class="btn ghost small">Edit</a>
            <form method="POST" action="{{ url_for('admin.delete_product', product_id=p.id) }}" onsubmit="return confirm('Delete {{ p.name }}?');">
                <input type="hidden" name="_csrf" value="{{ csrf_token }}">
                <button class="btn danger small">Delete</button>
            </form>
        </div></td>
    </tr>
    {% endfor %}
    </tbody>
</table>
</div>
{% endblock %}
