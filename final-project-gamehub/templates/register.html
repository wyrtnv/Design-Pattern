{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<section class="panel narrow">
    <h1>Create account</h1>
    <form method="POST">
        <input type="hidden" name="_csrf" value="{{ csrf_token }}">
        <label>Full name <input name="full_name" value="{{ request.form.get('full_name', '') }}" required></label>
        <label>Username <input name="username" value="{{ request.form.get('username', '') }}" pattern="[A-Za-z0-9_]{3,30}" required></label>
        <label>Password <input type="password" name="password" minlength="6" required></label>
        <label>Repeat password <input type="password" name="confirm" minlength="6" required></label>
        <button class="btn">Sign up</button>
    </form>
    <p class="muted">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</section>
{% endblock %}
